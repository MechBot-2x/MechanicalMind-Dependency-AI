[build-system]
requires = [
    "setuptools>=65.0.0",
    "wheel>=0.38.0",
]
build-backend = "setuptools.build_meta"

# ─────────────────────────── Metadatos del proyecto ────────────────────────
[project]
name = "mechanicalmind"
version = "3.0.1"
description = "AI-powered dependency analysis and conflict resolution tool for modern Python projects"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Benjamin Cabeza Duran", email = "benjamin.cabeza@example.com" },
]
maintainers = [
    { name = "MechMind Maintenance Team", email = "maintenance@mechmind.ai" },
]
keywords = ["dependency", "ai", "packaging", "resolution", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# ─────────────────────────── Dependencias obligatorias ─────────────────────
dependencies = [
    "requests>=2.32.4",
    "packaging>=21.0",
    "pyyaml>=6.0",
    "click>=8.0.0",
    "sqlalchemy>=1.4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
dev = [
    "black>=22.0",
    "ruff>=0.6.0",
    "isort>=5.0.0",
]
docs = [
    "sphinx>=5.0.0",
]
# Dependencias pesadas: requieren wheels, en Termux fallan con Python 3.14.
ml = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "tqdm>=4.0.0",
]

# ─────────────────────────── Entry point CLI ───────────────────────────────
[project.scripts]
mechmind = "mechanicalmind_ai.cli:cli"

# ─────────────────────────── URLs ──────────────────────────────────────────
[project.urls]
Homepage = "https://github.com/MechBot-2x/MechanicalMind-Dependency-AI"
Repository = "https://github.com/MechBot-2x/MechanicalMind-Dependency-AI.git"
"Bug Tracker" = "https://github.com/MechBot-2x/MechanicalMind-Dependency-AI/issues"

# ─────────────────────────── Layout de paquetes ────────────────────────────
[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["mechanicalmind*", "mechanicalmind_ai*"]

# ─────────────────────────── Config de desarrollo ──────────────────────────
[tool.pytest.ini_options]
testpaths = ["src"]
norecursedirs = [
    "venv", "mechmind-env", ".venv", ".git", "__pycache__",
    "node_modules", "build", "dist", "docs", "project-root",
]
addopts = "-v --tb=short"
python_files = ["test_*.py", "*_test.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "venv", "mechmind-env", ".venv", "build", "dist", ".git",
    "docs", "project-root", "node_modules",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E402", "F401", "UP007", "UP035", "B008", "B904"]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '/(\.git|\.venv|venv|mechmind-env|build|dist|docs|project-root|node_modules)/'

[tool.isort]
profile = "black"
line_length = 100
